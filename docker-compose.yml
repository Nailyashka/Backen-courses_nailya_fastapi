services:
  booking_db:
    image: postgres:16
    container_name: booking_db
    environment:
      POSTGRES_USER: abcde
      POSTGRES_PASSWORD: abcde
      POSTGRES_DB: booking
    ports:
      - "6432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - myNetwork

  booking_cache:
    image: redis:7.4
    container_name: booking_cache
    ports:
      - "7379:6379"
    networks:
      - myNetwork

  booking_back_service:
    container_name: booking_back
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "7777:8000"
    networks:
      - myNetwork
    env_file:
      - .env
    depends_on:
      - booking_db
      - booking_cache

  booking_celery_worker_service:
    container_name: booking_celery_worker
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - myNetwork
    command: celery --app=src.tasks.celery_app:celery_instance worker -l INFO
    env_file:
      - .env
    depends_on:
      - booking_db
      - booking_cache

  booking_celery_beat_service:
    container_name: booking_celery_beat
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - myNetwork
    command: celery --app=src.tasks.celery_app:celery_instance beat -l INFO
    env_file:
      - .env
    depends_on:
      - booking_db
      - booking_cache

volumes:
  pg-data:

networks:
  myNetwork:
    external: true